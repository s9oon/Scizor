[package]
name = "scizor"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"

# dynamic_linking speeds up dev builds; ship with --no-default-features
[features]
default = ["dev"]
dev = ["bevy/dynamic_linking"]

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
